<!DOCTYPE html>
<!-- Job-Master 个人秋招工作台：单文件应用（零依赖，浏览器直接打开） -->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Job-Master · 秋招工作台</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%23191918'/%3E%3Cpath d='M18.5 7.5 10 16l-4.5-4.5' stroke='white' stroke-width='2.4' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#F6F6F4;            /* 暖纸灰底，呼应 Cursor 的克制留白 */
  --panel:#FFFFFF;
  --panel-2:#FAFAF8;
  --border:#E9E9E4;
  --border-light:#F1F1ED;
  --ink:#191918;           /* 近黑墨 */
  --ink-2:#5C5C56;
  --ink-3:#A6A69E;
  --accent:#10B981;        /* 翡翠绿：品牌强调色 */
  --accent-hover:#059669;
  --accent-bg:#ECFDF5;
  --danger:#E5484D;
  --danger-bg:#FEF2F2;
  --radius:14px;
  --shadow-sm:0 1px 2px rgba(22,22,19,.05);
  --shadow-md:0 6px 20px rgba(22,22,19,.08);
  --shadow-lg:0 24px 64px rgba(22,22,19,.18);
  --font-sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --font-serif:"Georgia","Songti SC","STSong","Noto Serif SC","SimSun",serif;
  --font-mono:ui-monospace,"SF Mono","Cascadia Code","JetBrains Mono",Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font-sans);background:var(--bg);color:var(--ink);font-size:14px;line-height:1.55;overflow:hidden;-webkit-font-smoothing:antialiased}
::selection{background:rgba(16,185,129,.18)}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:flex;height:100vh}

/* ===== 侧边栏 ===== */
.sidebar{position:relative;display:flex;flex-direction:column;width:228px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--border)}
.sidebar.collapsed{width:60px}
.sidebar.collapsed .label,.sidebar.collapsed .app-title,.sidebar.collapsed .app-sub,.sidebar.collapsed .sync-text{display:none}
.sidebar-header{display:flex;align-items:center;gap:10px;padding:18px 14px;min-height:64px}
.sidebar.collapsed .sidebar-header{justify-content:center;gap:0;padding:18px 8px}
.logo{width:30px;height:30px;flex-shrink:0;border-radius:9px;background:linear-gradient(135deg,#2A2A28 0%,#191918 100%);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.28);cursor:pointer;transition:transform .15s,box-shadow .15s}
.logo:hover{transform:scale(1.06);box-shadow:0 3px 10px rgba(0,0,0,.32)}
.app-title{font-weight:600;font-size:14.5px;letter-spacing:.01em;white-space:nowrap;line-height:1.2}
.app-sub{display:block;font-family:var(--font-serif);font-size:11px;color:var(--ink-3);letter-spacing:.14em;margin-top:1px}
.collapse-btn{margin-left:auto;color:var(--ink-3)}
.sidebar.collapsed .collapse-btn{display:none}
.nav{flex:1;padding:10px 0;display:flex;flex-direction:column;gap:3px;overflow-y:auto}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;margin:0 8px;border:none;background:none;border-radius:10px;cursor:pointer;color:var(--ink-2);font-size:13.5px;text-align:left;width:calc(100% - 16px);transition:background .15s,color .15s}
.nav-item svg{flex-shrink:0}
.nav-item:hover{background:var(--panel-2);color:var(--ink)}
.nav-item.active{background:var(--ink);color:#fff;font-weight:500;box-shadow:var(--shadow-sm)}
.sidebar.collapsed .nav-item{justify-content:center;padding:10px 0}
.sidebar-footer{padding:12px;border-top:1px solid var(--border-light)}
.sidebar.collapsed .sidebar-footer{padding:12px 8px}
.sync-indicator{display:flex;align-items:center;gap:8px;cursor:pointer;padding:8px 10px;border:1px solid var(--border-light);background:var(--panel-2);border-radius:10px;font-size:11.5px;color:var(--ink-2);white-space:nowrap;font-family:var(--font-mono)}
.sync-indicator:hover{border-color:var(--border)}
.sidebar.collapsed .sync-indicator{justify-content:center;padding:8px 0;border:none;background:none}
.sync-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;background:#D4D4CC}
.sync-dot.ok{background:var(--accent)}
.sync-dot.pending{background:#F59E0B}
.sync-dot.err{background:var(--danger)}
.resize-handle{position:absolute;top:0;right:-3px;width:6px;height:100%;cursor:col-resize;z-index:10}
.sidebar.collapsed .resize-handle{display:none}

/* ===== 内容区 ===== */
.content{flex:1;overflow:auto;padding:30px 34px;min-width:0}
.content.anim>*{animation:fadeUp .32s cubic-bezier(.22,.8,.32,1) both}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.page-eyebrow{font-family:var(--font-mono);font-size:11px;letter-spacing:.14em;color:var(--ink-3);text-transform:uppercase;margin-bottom:6px}
.page-title{font-family:var(--font-serif);font-size:23px;font-weight:600;letter-spacing:.01em}
.page-desc{font-size:13px;color:var(--ink-2);margin-top:4px}

/* 工具栏 */
.toolbar{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
.input,.select{padding:8px 12px;border:1px solid var(--border);border-radius:10px;font:inherit;font-size:13px;background:#fff;color:var(--ink);transition:border-color .15s,box-shadow .15s}
.input:focus,.select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(16,185,129,.13)}
.select{cursor:pointer}
.search-wrap{position:relative}
.search-wrap svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--ink-3);width:15px;height:15px}
.search-wrap .input{padding-left:32px;width:240px;border-radius:999px}

/* 按钮：胶囊形，主按钮为 Cursor 标志性墨黑 */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:999px;border:1px solid var(--border);background:var(--panel);cursor:pointer;font-size:13px;color:var(--ink);transition:background .15s,border-color .15s,transform .12s,box-shadow .15s}
.btn:hover{background:var(--panel-2);border-color:#D8D8D1}
.btn:active{transform:scale(.97)}
.btn svg{width:15px;height:15px}
.btn-primary{background:var(--ink);border-color:var(--ink);color:#fff}
.btn-primary:hover{background:#000;border-color:#000;transform:translateY(-1px);box-shadow:0 6px 16px rgba(0,0,0,.16)}
.btn-primary:active{transform:scale(.97)}
.btn-sm{padding:5px 12px;font-size:12px}
.btn-sm svg{width:13px;height:13px}
.btn-danger-ghost{color:var(--danger)}
.btn-danger-ghost:hover{background:var(--danger-bg);border-color:#F3C5C6}
.icon-btn{padding:6px;border:none;background:none;color:var(--ink-3);cursor:pointer;border-radius:8px;display:inline-flex;transition:background .15s,color .15s,transform .12s}
.icon-btn:hover{background:var(--panel-2);color:var(--ink)}
.icon-btn:active{transform:scale(.92)}
.icon-btn svg{width:15px;height:15px}
.icon-btn.danger:hover{background:var(--danger-bg);color:var(--danger)}

/* 表格 */
.table-wrap{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);overflow:auto;max-height:calc(100vh - 210px);box-shadow:var(--shadow-sm)}
table{width:100%;border-collapse:collapse;min-width:1120px}
th{position:sticky;top:0;z-index:1;background:var(--panel-2);text-align:left;font-size:11px;font-weight:500;letter-spacing:.06em;color:var(--ink-3);padding:11px 16px;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:11px 16px;border-bottom:1px solid var(--border-light);font-size:13px;vertical-align:middle}
tbody tr{transition:background .12s}
tbody tr:hover{background:#FAFAF7}
tbody tr:last-child td{border-bottom:none}
.cell-strong{font-weight:600}
.cell-2{color:var(--ink-2)}
.cell-3{color:var(--ink-3)}
.notes-cell{max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-actions{display:flex;gap:2px}
/* 拖拽排序与置顶 */
.drag-cell{width:30px;padding-left:10px;padding-right:0}
.drag-handle{display:inline-flex;align-items:center;color:#CFCEC6;cursor:grab;border-radius:6px;padding:2px;transition:color .15s}
.drag-handle:hover{color:var(--ink-2)}
.drag-handle:active{cursor:grabbing}
tbody tr.dragging{opacity:.35}
tbody tr.drop-before td{box-shadow:inset 0 2px 0 var(--accent)}
tbody tr.drop-after td{box-shadow:inset 0 -2px 0 var(--accent)}
tbody tr.pinned{background:#F4FBF7}
tbody tr.pinned:hover{background:#EDF8F2}
tbody tr.pinned .drag-cell{box-shadow:inset 3px 0 0 var(--accent)}
.icon-btn.pin-active{color:var(--accent)}
.icon-btn.pin-active:hover{background:var(--accent-bg);color:var(--accent-hover)}
.row-link{color:var(--ink-3);display:inline-flex}
.row-link:hover{color:var(--accent-hover)}
.type-tag{font-size:11px;color:var(--ink-2);white-space:nowrap;border:1px solid var(--border);border-radius:999px;padding:2px 9px;background:#fff}
.status-select{padding:3px 10px;border:1px solid transparent;border-radius:999px;font-size:12px;background:transparent;cursor:pointer;font-weight:500;font-family:inherit;transition:box-shadow .15s}
.status-select:hover{box-shadow:var(--shadow-sm)}
.badge{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:500;white-space:nowrap}
.badge svg{width:12px;height:12px}
.loc-tags{display:flex;gap:4px;flex-wrap:wrap}
.loc-tag{font-size:11px;border:1px solid var(--border);border-radius:999px;padding:1px 8px;white-space:nowrap}

/* 工作地点多选 */
.ms-wrap{position:relative}
.ms-toggle{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;text-align:left;cursor:pointer;color:var(--ink)}
.ms-toggle svg{flex-shrink:0;color:var(--ink-3);transition:transform .15s}
.ms-wrap.open .ms-toggle svg{transform:rotate(180deg)}
.ms-vals{display:flex;gap:4px;flex-wrap:wrap;overflow:hidden}
.ms-vals .ph{color:var(--ink-3)}
.ms-chip{font-size:11px;color:var(--ink-2);border:1px solid var(--border);border-radius:999px;padding:1px 8px;background:var(--panel-2);white-space:nowrap}
.ms-panel{display:none;border:1px solid var(--border-light);border-radius:10px;background:var(--panel-2);padding:6px;margin-top:6px;flex-wrap:wrap;gap:2px}
.ms-wrap.open .ms-panel{display:flex}
.ms-opt{display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:6px 10px;border-radius:8px;cursor:pointer;user-select:none;color:var(--ink)}
.ms-opt:hover{background:#fff}
.ms-opt input{accent-color:var(--accent);margin:0}
.ms-add{border:1px dashed var(--border);background:transparent;font-family:inherit;color:var(--ink-2)}
.ms-add:hover{background:#fff;color:var(--ink);border-color:var(--ink-3)}
.ms-del{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;padding:0;border:none;background:transparent;border-radius:6px;color:var(--ink-3);cursor:pointer}
.ms-del:hover{background:#FEE2E2;color:var(--danger)}

/* 看板 */
.kanban{display:flex;gap:12px;overflow-x:auto;align-items:stretch;padding-bottom:8px;height:calc(100vh - 158px)}
.kanban-col{min-width:228px;flex:1 0 228px;background:var(--panel-2);border:1px solid var(--border-light);border-radius:var(--radius);display:flex;flex-direction:column;max-height:100%;transition:border-color .15s,background .15s}
.kanban-col.drag-over{border-color:var(--accent);background:#F0FAF6;box-shadow:0 0 0 3px rgba(16,185,129,.12)}
.kanban-col-head{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--border-light)}
.col-title{font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px;white-space:nowrap}
.col-title .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.col-count{font-size:11px;font-family:var(--font-mono);color:var(--ink-2);background:#fff;border:1px solid var(--border-light);border-radius:999px;padding:1px 8px}
.kanban-cards{padding:10px;display:flex;flex-direction:column;gap:8px;overflow-y:auto;flex:1}
.k-card{background:#fff;border:1px solid var(--border-light);border-radius:11px;padding:11px 13px;cursor:grab;box-shadow:var(--shadow-sm);transition:border-color .15s,box-shadow .15s,transform .15s}
.k-card:hover{border-color:#D8D8D1;box-shadow:var(--shadow-md);transform:translateY(-1px)}
.k-card:active{cursor:grabbing}
.k-company{font-weight:600;font-size:13px;margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.k-position{font-size:12px;color:var(--ink-2);margin-bottom:9px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.k-meta{display:flex;align-items:center;justify-content:space-between;font-size:11px;color:var(--ink-3);font-family:var(--font-mono)}
.k-empty{font-size:12px;color:var(--ink-3);text-align:center;padding:18px 0}

/* 邮箱 */
.mail-list{display:flex;flex-direction:column;gap:10px}
.mail-row{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:15px 18px;box-shadow:var(--shadow-sm);transition:border-color .15s,box-shadow .15s}
.mail-row:hover{border-color:#D8D8D1;box-shadow:var(--shadow-md)}
.mail-row.processed{opacity:.62}
.mail-head{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.mail-subject{font-weight:600;font-size:14px;display:flex;align-items:center;gap:8px;min-width:0}
.mail-dot{width:7px;height:7px;border-radius:50%;background:var(--accent);flex-shrink:0}
.mail-date{font-size:11px;color:var(--ink-3);white-space:nowrap;flex-shrink:0;font-family:var(--font-mono)}
.mail-sub{font-size:13px;color:var(--ink-2);margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mail-foot{display:flex;gap:8px;margin-top:11px;align-items:center;flex-wrap:wrap}

/* 数据管理 */
.data-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow-sm)}
.card h3{font-size:14px;font-weight:600;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.card h3 svg{width:16px;height:16px;color:var(--accent)}
.kv{display:flex;justify-content:space-between;gap:12px;font-size:13px;padding:7px 0;border-bottom:1px dashed var(--border-light)}
.kv:last-of-type{border-bottom:none}
.kv .k{color:var(--ink-2);flex-shrink:0}
.kv .v{text-align:right;word-break:break-all;font-family:var(--font-mono);font-size:12px}
.hint{font-size:12px;color:var(--ink-3);margin-top:14px;line-height:1.7}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(136px,1fr));gap:12px;margin-bottom:18px}
.stat{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow-sm);position:relative;overflow:hidden}
.stat::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--border)}
.stat.hl::before{background:var(--accent)}
.stat .num{font-family:var(--font-serif);font-size:27px;font-weight:600;line-height:1.15}
.stat .lbl{font-size:12px;color:var(--ink-2);margin-top:3px}

/* 空状态 */
.empty-state{background:var(--panel-2);border:1px dashed #DFDFD8;border-radius:16px;padding:60px 20px;text-align:center;color:var(--ink-2)}
.empty-state svg{color:var(--ink-3)}
.empty-state h3{color:var(--ink);font-size:17px;margin:14px 0 6px;font-weight:600;font-family:var(--font-serif)}
.empty-state p{font-size:13px;margin-bottom:20px}

/* 模态框 */
.modal-backdrop{position:fixed;inset:0;background:rgba(22,22,19,.42);display:none;align-items:flex-start;justify-content:center;z-index:100;padding:6vh 16px;animation:backdropIn .2s ease}
.modal-backdrop.open{display:flex}
@keyframes backdropIn{from{opacity:0}to{opacity:1}}
.modal{background:var(--panel);border-radius:16px;width:560px;max-width:100%;max-height:86vh;display:flex;flex-direction:column;box-shadow:var(--shadow-lg);animation:modalIn .28s cubic-bezier(.22,.9,.32,1.05)}
@keyframes modalIn{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:none}}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--border-light)}
.modal-head h3{font-size:16px;font-weight:600;font-family:var(--font-serif)}
.modal-body{padding:22px;overflow:auto}
.modal-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 22px;border-top:1px solid var(--border-light);background:var(--panel-2);border-radius:0 0 16px 16px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.field.span2{grid-column:span 2}
.field label{display:block;font-size:12px;color:var(--ink-2);margin-bottom:6px}
.field .input,.field .select{width:100%}
textarea{resize:vertical;font-family:inherit}
.form-meta{font-size:11px;color:var(--ink-3);font-family:var(--font-mono)}

/* Toast */
.toast-wrap{position:fixed;right:20px;bottom:20px;display:flex;flex-direction:column;gap:8px;z-index:200}
.toast{background:var(--ink);color:#fff;font-size:13px;padding:10px 16px;border-radius:11px;box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:8px;transition:opacity .3s;animation:toastIn .3s cubic-bezier(.22,.9,.32,1.1)}
.toast svg{width:14px;height:14px;color:var(--accent);flex-shrink:0}
.toast.err svg{color:#F87171}
@keyframes toastIn{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}

::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#DBDBD3;border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:#BFBFB6}
::-webkit-scrollbar-track{background:transparent}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="logo" id="logoBox"></div>
      <div>
        <span class="app-title">Job-Master</span>
        <span class="app-sub">秋招工作台</span>
      </div>
      <button class="icon-btn collapse-btn" id="collapseBtn" title="收起 / 展开"></button>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="sidebar-footer">
      <div class="sync-indicator" id="syncIndicator" title="数据同步状态，点击前往数据管理">
        <span class="sync-dot"></span><span class="sync-text">未启用同步</span>
      </div>
    </div>
    <div class="resize-handle" id="resizeHandle" title="拖动调整宽度"></div>
  </aside>
  <main class="content" id="content"></main>
</div>

<!-- 新增/编辑投递 模态框 -->
<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal">
    <div class="modal-head">
      <h3 id="modalTitle">新增投递</h3>
      <button class="icon-btn" id="modalClose" type="button"></button>
    </div>
    <form id="entryForm">
      <div class="modal-body">
        <div class="form-grid">
          <div class="field"><label>企业名称 *</label><input class="input" name="company" placeholder="如：腾讯" required></div>
          <div class="field"><label>部门名称</label><input class="input" name="department" placeholder="选填，如：CSIG"></div>
          <div class="field"><label>当前状态</label>
            <select class="select" name="status" id="statusSelect"></select></div>
          <div class="field"><label>目标岗位 *</label><input class="input" name="position" placeholder="如：AI 应用开发工程师" required></div>
          <div class="field"><label>所属行业</label>
            <select class="select" name="industry" id="industrySelect"></select></div>
          <div class="field"><label>工作地点（可多选）</label>
            <div class="ms-wrap" id="locationMs"></div></div>
          <div class="field"><label>最新日期</label><input class="input" type="date" name="latestDate"></div>
          <div class="field"><label>官网链接</label><input class="input" type="url" name="link" placeholder="https://（选填）"></div>
          <div class="field span2"><label>备注</label><textarea class="input" name="notes" rows="3" placeholder="选填；进度变更会自动追加记录"></textarea></div>
        </div>
      </div>
      <div class="modal-foot">
        <span class="form-meta" id="formMeta"></span>
        <div style="display:flex;gap:10px">
          <button type="button" class="btn" data-close>取消</button>
          <button type="submit" class="btn btn-primary"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>保存</button>
        </div>
      </div>
    </form>
  </div>
</div>

function todayStr() { const d = new Date(); return `${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`; }

function fmtDT(v) {

function migrateLegacy(e) {

      el.textContent = Math.round(target * (1 - Math.pow(1 - p, 3)));

/* ==================== CSV 解析 / 序列化 ==================== */
function parseCSV(text) {
  if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1); // 去 BOM
  const rows = []; let row = [], field = '', inQ = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQ) {
      if (c === '"') { if (text[i+1] === '"') { field += '"'; i++; } else inQ = false; }
      else field += c;
    } else {
      if (c === '"') inQ = true;
      else if (c === ',') { row.push(field); field = ''; }
      else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
      else if (c !== '\r') field += c;
    }
  }
  if (field !== '' || row.length) { row.push(field); rows.push(row); }
  return rows;
}
function csvEscape(v) {
  v = String(v ?? '');
  return /[",\r\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
}
function serializeCSV() {
  const lines = [FIELDS.join(',')];
  for (const e of state.entries) lines.push(FIELDS.map(f => csvEscape(e[f])).join(','));
  return '\ufeff' + lines.join('\r\n') + '\r\n';
}
function rowsToEntries(rows) {
  if (!rows.length) return [];
  const header = rows[0].map(h => h.trim());
  const idx = {};
  FIELDS.forEach(f => {
    let j = header.indexOf(f);
    if (j < 0 && FIELD_ALIASES[f]) j = header.indexOf(FIELD_ALIASES[f]); // 旧表头回退
    idx[f] = j;
  });
  const out = [];
  for (let i = 1; i < rows.length; i++) {
    const r = rows[i];
    if (r.length === 1 && r[0] === '') continue; // 跳过空行
    const e = {};
    FIELDS.forEach(f => { const j = idx[f]; e[f] = (j >= 0 && j < r.length) ? (r[j] || '') : ''; });
    out.push(normalizeEntry(e));
  }
  return out;
}
/* 行级合并：同 id 时 updatedAt 新者胜；keepLocalOnly 控制是否保留 CSV 中不存在的本地行 */
function mergeEntries(local, csv, keepLocalOnly) {
  const map = new Map();
  csv.forEach(e => map.set(e.id, e));
  for (const l of local) {
    const c = map.get(l.id);
    if (!c) { if (keepLocalOnly) map.set(l.id, l); continue; }
    if ((l.updatedAt || '') > (c.updatedAt || '')) map.set(l.id, l);
  }
  return Array.from(map.values());
}

/* ==================== IndexedDB（保存目录句柄） ==================== */
function idbOpen() {
  return new Promise((res, rej) => {
    const req = indexedDB.open('jobmaster-fs', 1);
    req.onupgradeneeded = () => req.result.createObjectStore('handles');
    req.onsuccess = () => res(req.result);
    req.onerror = () => rej(req.error);
  });
}
async function idbSet(key, val) {
  const db = await idbOpen();
  return new Promise((res, rej) => {
    const tx = db.transaction('handles', 'readwrite');
    tx.objectStore('handles').put(val, key);
    tx.oncomplete = () => { db.close(); res(); };
    tx.onerror = () => { db.close(); rej(tx.error); };
  });
}
async function idbGet(key) {
  const db = await idbOpen();
  return new Promise((res, rej) => {
    const tx = db.transaction('handles', 'readonly');
    const rq = tx.objectStore('handles').get(key);
    rq.onsuccess = () => { db.close(); res(rq.result); };
    rq.onerror = () => { db.close(); rej(rq.error); };
  });
}

/* ==================== 同步层（File System Access API） ==================== */
async function initSync() {
  let handle = null;
  if (window.showDirectoryPicker) {
    try { handle = await idbGet('dirHandle'); } catch (e) { /* file:// 下 IndexedDB 可能不可用 */ }
  }
  if (handle) {
    try {
      const perm = await handle.queryPermission({ mode: 'readwrite' });
      if (perm === 'granted') await activateSync(handle);
      else { state.dirHandle = handle; state.dirName = handle.name; state.syncStatus = 'pending'; }
    } catch (e) { state.syncStatus = 'error'; state.syncError = e.message; }
    updateSyncIndicator();
    render();
    return;
  }
  /* 无目录授权时：默认尝试项目根目录 ./data 的 HTTP 同步 */
  await detectServerSync();
  updateSyncIndicator();
  render();
}
async function activateSync(handle) {
  state.dirHandle = handle;
  state.dirName = handle.name;
  state.syncEnabled = true;
  try {
    await reloadFromFiles(true);
    state.syncStatus = 'ok'; state.syncError = '';
    startWatchers();
  } catch (e) {
    state.syncStatus = 'error'; state.syncError = e.message || String(e);
  }
  updateSyncIndicator();
  render();
}
async function reloadFromFiles(isInit) {
  const fh = await state.dirHandle.getFileHandle(CSV_FILENAME, { create: true });
  const file = await fh.getFile();
  state.lastReadAt = new Date();
  state.lastSyncedMtime = file.lastModified;
  const entries = rowsToEntries(parseCSV(await file.text()));
  if (isInit && !entries.length && state.entries.length) {
    await writeCSVNow(); // 目录中 CSV 为空而本地有数据：以本地数据初始化文件
  } else {
    state.entries = mergeEntries(state.entries, entries, state.pendingWrite);
    persistLocal();
  }
  await loadEmails(true);
}
let writeTimer = null;
function saveAll() {
  persistLocal();
  if (state.dirHandle) {
    state.pendingWrite = true;
    clearTimeout(writeTimer);
    writeTimer = setTimeout(writeCSVNow, 500);
  } else if (state.serverMode) {
    state.pendingWrite = true;
    clearTimeout(writeTimer);
    writeTimer = setTimeout(writeCSVHTTP, 500);
  }
}
async function writeCSVNow() {
  if (!state.syncEnabled) return;
  clearTimeout(writeTimer);
  state.writing = true;
  try {
    const fh = await state.dirHandle.getFileHandle(CSV_FILENAME, { create: true });
    const w = await fh.createWritable();
    await w.write(serializeCSV());
    await w.close();
    const file = await fh.getFile();
    state.lastSyncedMtime = file.lastModified;
    state.lastWriteAt = new Date();
    state.pendingWrite = false;
    state.syncStatus = 'ok'; state.syncError = '';
    if (state.emailsDirty) await writeEmailsNow();
  } catch (e) {
    state.syncStatus = 'error'; state.syncError = e.message || String(e);
  } finally {
    state.writing = false;
    updateSyncIndicator();
  }
}
async function writeEmailsNow() {
  if (!state.dirHandle) return;
  const fh = await state.dirHandle.getFileHandle(EMAILS_FILENAME, { create: true });
  const w = await fh.createWritable();
  await w.write(JSON.stringify({ lastFetchedAt: state.lastFetchedAt, emails: state.emails }, null, 2));
  await w.close();
  const file = await fh.getFile();
  emailsMtime = file.lastModified;
  state.emailsDirty = false;
}
async function loadEmails(force) {
  if (!state.syncEnabled) return false;
  try {
    const fh = await state.dirHandle.getFileHandle(EMAILS_FILENAME, { create: false });
    const file = await fh.getFile();
    if (!force && file.lastModified <= emailsMtime) return false;
    emailsMtime = file.lastModified;
    const j = JSON.parse(await file.text());
    state.emails = Array.isArray(j.emails) ? j.emails : [];
    state.lastFetchedAt = j.lastFetchedAt || null;
    return true;
  } catch (e) { return false; } // 文件不存在时静默
}

/* ==================== 同步层（HTTP 模式：项目根目录 ./data） ====================
   页面经本地/预览服务器访问时，自动对 ./data 启用同步：
   读取（GET）始终自动；写回（PUT）取决于服务器，若不支持则降级为只读同步，
   可在「数据管理」中切换为目录授权同步以获得完整读写能力。 */
async function fetchDataFile(name, method, body) {
  const opt = { cache: 'no-store' };
  if (method) { opt.method = method; opt.body = body; }
  const r = await fetch(`${DATA_DIR}/${name}`, opt);
  if (!r.ok) throw new Error(String(r.status));
  return r;
}
async function detectServerSync() {
  try {
    const r = await fetchDataFile(CSV_FILENAME);
    state.httpCsvLM = r.headers.get('Last-Modified') || '';
    const entries = rowsToEntries(parseCSV(await r.text()));
    state.entries = mergeEntries(state.entries, entries, false);
    persistLocal();
    state.serverMode = true;
    state.syncEnabled = true;
    state.syncStatus = 'ok';
    state.lastReadAt = new Date();
    try { await loadEmailsHTTP(true); } catch (e) { /* emails.json 不存在时忽略 */ }
    startWatchers();
    toast('已启用 ./data 数据同步');
  } catch (e) { /* 服务器不可达或非 HTTP 环境：保持未启用 */ }
}
async function reloadFromHTTP() {
  const r = await fetchDataFile(CSV_FILENAME);
  state.httpCsvLM = r.headers.get('Last-Modified') || '';
  state.lastReadAt = new Date();
  const entries = rowsToEntries(parseCSV(await r.text()));
  if (!entries.length && state.entries.length) {
    await writeCSVHTTP(); // 目录中 CSV 为空而本地有数据：以本地数据初始化文件
  } else {
    state.entries = mergeEntries(state.entries, entries, state.pendingWrite);
    persistLocal();
  }
  try { await loadEmailsHTTP(true); } catch (e) {}
}
async function writeCSVHTTP() {
  if (!state.serverMode) return;
  clearTimeout(writeTimer);
  state.writing = true;
  try {
    await fetchDataFile(CSV_FILENAME, 'PUT', serializeCSV());
    state.serverWritable = true;
    state.lastWriteAt = new Date();
    state.pendingWrite = false;
    state.syncStatus = 'ok'; state.syncError = '';
    if (state.emailsDirty) await writeEmailsHTTP();
  } catch (e) {
    state.serverWritable = false; // 服务器不支持 PUT：降级为只读同步
  } finally {
    state.writing = false;
    updateSyncIndicator();
  }
}
async function writeEmailsHTTP() {
  try {
    await fetchDataFile(EMAILS_FILENAME, 'PUT',
      JSON.stringify({ lastFetchedAt: state.lastFetchedAt, emails: state.emails }, null, 2));
    state.emailsDirty = false;
  } catch (e) { /* 只读模式下邮件处理状态仅保留在本地 */ }
}
async function loadEmailsHTTP(force) {
  if (!state.serverMode) return false;
  const r = await fetchDataFile(EMAILS_FILENAME);
  const lm = r.headers.get('Last-Modified') || '';
  if (!force && lm && lm === state.httpMailLM) return false;
  state.httpMailLM = lm;
  const j = JSON.parse(await r.text());
  state.emails = Array.isArray(j.emails) ? j.emails : [];
  state.lastFetchedAt = j.lastFetchedAt || null;
  return true;
}
async function checkExternalHTTP() {
  if (!state.serverMode || state.writing || state.pendingWrite) return;
  try {
    let changed = false;
    const r = await fetchDataFile(CSV_FILENAME);
    const lm = r.headers.get('Last-Modified') || '';
    if (!lm || lm !== state.httpCsvLM) {
      state.httpCsvLM = lm;
      state.lastReadAt = new Date();
      const entries = rowsToEntries(parseCSV(await r.text()));
      state.entries = mergeEntries(state.entries, entries, false);
      persistLocal();
      changed = true;
    }
    try { if (await loadEmailsHTTP(false)) changed = true; } catch (e) {}
    if (changed) { render(); toast('已同步外部数据变更'); }
  } catch (e) { /* 静默，下次再试 */ }
}

async function checkExternal() {
  if (!state.syncEnabled || state.writing || state.pendingWrite) return;
  try {
    let changed = false;
    const fh = await state.dirHandle.getFileHandle(CSV_FILENAME, { create: false });
    const file = await fh.getFile();
    if (file.lastModified > state.lastSyncedMtime) {
      state.lastSyncedMtime = file.lastModified;
      state.lastReadAt = new Date();
      const entries = rowsToEntries(parseCSV(await file.text()));
      state.entries = mergeEntries(state.entries, entries, false);
      persistLocal();
      changed = true;
    }
    if (await loadEmails(false)) changed = true;
    if (changed) { render(); toast('已同步外部数据变更'); }
  } catch (e) { /* 静默，下次再试 */ }
}
let extTimer = null;
function scheduleExternalCheck() {
  clearTimeout(extTimer);
  extTimer = setTimeout(() => {
    if (state.dirHandle) checkExternal();
    else if (state.serverMode) checkExternalHTTP();
  }, 800);
}
function flushPendingWrite() {
  if (!state.pendingWrite) return;
  if (state.dirHandle) writeCSVNow();
  else if (state.serverMode) writeCSVHTTP();
}
function startWatchers() {
  if (watchersStarted) return;
  watchersStarted = true;
  window.addEventListener('focus', scheduleExternalCheck);
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) flushPendingWrite();
    else scheduleExternalCheck();
  });
  /* 页面关闭/刷新前尽力冲刷未落盘变更 */
  window.addEventListener('pagehide', flushPendingWrite);
  /* 定时自动保存：本地缓存优先，每 60 秒把缓存中的变更自动保存到本地目录 */
  setInterval(() => {
    flushPendingWrite();
    if (state.dirHandle) checkExternal();
    else if (state.serverMode) checkExternalHTTP();
  }, 60000);
}
async function enableSync() {
  if (!window.showDirectoryPicker) { toast('当前浏览器不支持目录同步，请使用 Chrome / Edge', 'err'); return; }
  try {
    const handle = await window.showDirectoryPicker({ mode: 'readwrite' });
    await activateSync(handle);
    try { await idbSet('dirHandle', handle); } catch (e) {}
    toast('数据同步已启用');
  } catch (err) {
    if (err.name !== 'AbortError') toast('启用失败：' + err.message, 'err');
  }
}
async function reauth() {
  try {
    const p = await state.dirHandle.requestPermission({ mode: 'readwrite' });
    if (p === 'granted') {
      await activateSync(state.dirHandle);
      try { await idbSet('dirHandle', state.dirHandle); } catch (e) {}
      toast('已重新授权');
    }
  } catch (e) { toast('授权失败：' + e.message, 'err'); }
}
async function manualResync() {
  if (!state.syncEnabled) return;
  try {
    if (state.dirHandle) {
      await writeCSVNow();
      await reloadFromFiles(false);
    } else if (state.serverMode) {
      await writeCSVHTTP();
      await reloadFromHTTP();
    } else return;
    render();
    toast('已重新同步');
  } catch (e) {
    state.syncStatus = 'error'; state.syncError = e.message || String(e);
    render(); toast('同步失败：' + state.syncError, 'err');
  }
}
function updateSyncIndicator() {
  const el = $('#syncIndicator'); if (!el) return;
  const dot = el.querySelector('.sync-dot');
  const txt = el.querySelector('.sync-text');
  let cls = '', text = '未启用同步';
  if (state.syncStatus === 'ok') {
    cls = 'ok';
    const t = state.lastWriteAt || state.lastReadAt;
    if (state.serverMode && !state.dirHandle) {
      text = (state.serverWritable === false ? '只读同步 ./data' : '已同步 ./data') + (t ? ' ' + fmtDT(t) : '');
    } else {
      text = '已同步' + (t ? ' ' + fmtDT(t) : '');
    }
  }
  else if (state.syncStatus === 'pending') { cls = 'pending'; text = '待重新授权'; }
  else if (state.syncStatus === 'error') { cls = 'err'; text = '同步出错'; }
  dot.className = 'sync-dot ' + cls;
  txt.textContent = text;
}

function computeStats() {
  const byStatus = {};
  state.entries.forEach(e => { byStatus[e.status] = (byStatus[e.status] || 0) + 1; });
  const byIndustry = {};
  state.entries.forEach(e => { byIndustry[e.industry] = (byIndustry[e.industry] || 0) + 1; });
  const weekAgo = new Date(Date.now() - 7 * 864e5).toISOString().slice(0, 10);
  return {
    total: state.entries.length,
    byStatus, byIndustry,
    week: state.entries.filter(e => e.latestDate >= weekAgo).length,
    offers: byStatus['Offer'] || 0
  };

function pageHead(eyebrow, title, desc, actionHTML) {

function filteredEntries() {
  const q = ui.search.trim().toLowerCase();
  const list = state.entries.filter(e =>
    (!ui.industryFilter || e.industry === ui.industryFilter) &&
    (!ui.statusFilter || e.status === ui.statusFilter) &&
    (!q || `${e.company} ${e.position} ${e.department} ${e.industry} ${e.location}`.toLowerCase().includes(q))
  );
  // 置顶行始终排最前（按 ui.pinned 顺序）；其余按排序方式排列
  const pinnedSet = new Set(ui.pinned);
  const pinned = ui.pinned.map(id => list.find(e => e.id === id)).filter(Boolean);
  const rest = list.filter(e => !pinnedSet.has(e.id));
  if (ui.sortMode === 'auto') rest.sort((a, b) => (b.latestDate || '').localeCompare(a.latestDate || ''));
  return [...pinned, ...rest];
}
/* 置顶 / 取消置顶 */
function togglePin(id) {
  const i = ui.pinned.indexOf(id);
  if (i >= 0) {
    ui.pinned.splice(i, 1);
  } else {
    ui.pinned.unshift(id);
    const e = state.entries.find(x => x.id === id); // 置顶行移到数据最前，CSV 行序与显示一致
    if (e) state.entries = [e, ...state.entries.filter(x => x.id !== id)];
  }
  syncStoredOrder(); persistUi(); saveAll(); render();
  toast(i >= 0 ? '已取消置顶' : '已置顶');
}
/* 手动顺序的本地记忆：CSV 行序在只读同步下可能写不回，故同时存于 localStorage */
function syncStoredOrder() { ui.order = state.entries.map(e => e.id); }
function applyStoredOrder() {
  if (ui.sortMode !== 'manual' || !Array.isArray(ui.order) || !ui.order.length) return;
  const byId = new Map(state.entries.map(e => [e.id, e]));
  const seen = new Set();
  const ordered = [];
  for (const id of ui.order) { const e = byId.get(id); if (e && !seen.has(id)) { ordered.push(e); seen.add(id); } }
  const rest = state.entries.filter(e => !seen.has(e.id));
  state.entries = [...ordered, ...rest];
}
/* 应用新的显示顺序：ids 为当前可见行的新顺序，
   可见行占据它们原本所在的槽位，被筛选隐藏的行保持原位不动。 */
function applyListOrder(ids) {
  const idset = new Set(ids);
  const byId = new Map(state.entries.map(e => [e.id, e]));
  const ordered = ids.map(id => byId.get(id)).filter(Boolean);
  let k = 0;
  state.entries = state.entries.map(e => idset.has(e.id) ? ordered[k++] : e);
  syncStoredOrder();
}
/* 切换排序方式：切到手动时优先恢复本地记住的手动顺序，否则固化当前显示顺序 */
function setSortMode(mode) {
  if (mode === ui.sortMode) return;
  ui.sortMode = mode;
  if (mode === 'manual') {
    if (ui.order.length) applyStoredOrder();
    else applyListOrder(filteredEntries().map(e => e.id));
  }
  persistUi(); saveAll(); render();
}

/* ==================== 事件绑定 ==================== */
function buildNav() {
  const items = [
    ['list', I.list, '投递列表'],
    ['kanban', I.kanban, '进度看板'],
    ['mail', I.mail, '邮箱收件'],
    ['data', I.database, '数据管理']
  ];
  $('#nav').innerHTML = items.map(([m, icon, label]) =>
    `<button class="nav-item ${ui.module === m ? 'active' : ''}" data-module="${m}" title="${label}">${icon}<span class="label">${label}</span></button>`
  ).join('');
}
function bindEvents() {
  const content = $('#content');
  /* 导航切换 */
  $('#nav').addEventListener('click', e => {
    const btn = e.target.closest('.nav-item');
    if (!btn) return;
    ui.module = btn.dataset.module;
    persistUi(); render();
  });
  $('#syncIndicator').addEventListener('click', () => { ui.module = 'data'; persistUi(); render(); });
  /* 侧栏折叠与拖宽：收起态隐藏箭头，点击品牌 Logo 复原 */
  $('#collapseBtn').innerHTML = I.chevronsLeft;
  $('#collapseBtn').addEventListener('click', () => {
    ui.collapsed = !ui.collapsed; applySidebar(); persistUi();
  });
  $('#logoBox').addEventListener('click', () => {
    if (!ui.collapsed) return;
    ui.collapsed = false; applySidebar(); persistUi();
  });
  const sidebar = $('#sidebar');
  let dragging = false;
  $('#resizeHandle').addEventListener('mousedown', e => {
    if (ui.collapsed) return;
    dragging = true; document.body.style.cursor = 'col-resize'; e.preventDefault();
  });
  document.addEventListener('mousemove', e => {
    if (!dragging) return;
    ui.width = Math.min(320, Math.max(180, e.clientX));
    sidebar.style.width = ui.width + 'px';
  });
  document.addEventListener('mouseup', () => {
    if (dragging) { dragging = false; document.body.style.cursor = ''; persistUi(); }
  });
  /* 内容区统一事件代理 */
  content.addEventListener('click', async e => {
    const btn = e.target.closest('[data-action]');
    if (!btn) return;
    const act = btn.dataset.action, id = btn.dataset.id;
    if (act === 'add') openEntryModal(null);
    else if (act === 'edit') { const en = state.entries.find(x => x.id === id); if (en) openEntryModal(en); }
    else if (act === 'delete') {
      const en = state.entries.find(x => x.id === id);
      if (en && window.confirm(`确定删除「${en.company} · ${en.position}」这条投递记录？`)) {
        state.entries = state.entries.filter(x => x.id !== id);
        saveAll(); render(); toast('已删除');
      }
    }
    else if (act === 'clear-filter') { ui.search = ''; ui.industryFilter = ''; ui.statusFilter = ''; render(); }
    else if (act === 'pin') togglePin(id);
    else if (act === 'enable-sync') enableSync();
    else if (act === 'reauth') reauth();
    else if (act === 'resync') manualResync();
    else if (act === 'export') exportCSV();
    else if (act === 'import') $('#importFile').click();
    else if (act === 'clear-cache') {
      if (window.confirm('确定清空浏览器本地缓存？（data/ 目录中的 CSV 不受影响）')) {
        localStorage.removeItem(LS_KEY); location.reload();
      }
    }
    else if (act === 'refresh-mail') { await loadEmails(true); render(); }
    else if (act === 'mail-create') mailCreate(btn.dataset.email);
    else if (act === 'mail-ignore') {
      markEmail(btn.dataset.email, { processed: true, matchedAction: 'ignored' });
      saveAll(); render();
    }
  });
  content.addEventListener('input', e => {
    if (e.target.id === 'searchInput') {
      ui.search = e.target.value;
      const wrap = $('#listTableWrap');
      if (wrap) wrap.innerHTML = listTableHTML();
      const cnt = $('#listCount');
      if (cnt) cnt.textContent = `共 ${state.entries.length} 条投递记录，当前筛选 ${filteredEntries().length} 条`;
    }
  });
  content.addEventListener('change', e => {
    if (e.target.id === 'industryFilter') { ui.industryFilter = e.target.value; render(); }
    else if (e.target.id === 'statusFilter') { ui.statusFilter = e.target.value; render(); }
    else if (e.target.id === 'mailFilter') { ui.mailFilter = e.target.value; render(); }
    else if (e.target.id === 'sortMode') setSortMode(e.target.value);
    else if (e.target.matches('select.status-select')) changeStatus(e.target.dataset.id, e.target.value);
    else if (e.target.id === 'importFile') { importCSV(e.target.files[0]); e.target.value = ''; }
  });
  /* 看板拖拽 */
  content.addEventListener('dragstart', e => {
    const card = e.target.closest('.k-card');
    if (!card) return;
    e.dataTransfer.setData('text/plain', card.dataset.id);
    e.dataTransfer.effectAllowed = 'move';
  });
  content.addEventListener('dragover', e => {
    const col = e.target.closest('.kanban-col');
    if (col) { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; col.classList.add('drag-over'); }
  });
  content.addEventListener('dragleave', e => {
    const col = e.target.closest('.kanban-col');
    if (col && !col.contains(e.relatedTarget)) col.classList.remove('drag-over');
  });
  content.addEventListener('drop', e => {
    const col = e.target.closest('.kanban-col');
    if (!col) return;
    e.preventDefault();
    col.classList.remove('drag-over');
    const id = e.dataTransfer.getData('text/plain');
    if (id) changeStatus(id, col.dataset.status);
  });
  /* 投递列表：拖拽手柄调整行顺序 */
  content.addEventListener('mousedown', e => {
    const h = e.target.closest('.drag-handle');
    if (!h) return;
    const tr = h.closest('tr[data-id]');
    if (tr) tr.draggable = true;
  });
  content.addEventListener('dragstart', e => {
    const tr = e.target.closest && e.target.closest('tr[data-id]');
    if (!tr || !tr.draggable) return;
    dragRowId = tr.dataset.id;
    e.dataTransfer.setData('text/plain', 'row:' + dragRowId);
    e.dataTransfer.effectAllowed = 'move';
    requestAnimationFrame(() => tr.classList.add('dragging'));
    /* 自动排序下首次拖动：切换为手动顺序，并把当前显示顺序固化为数据顺序（不重渲染，避免打断拖拽） */
    if (ui.sortMode === 'auto') {
      ui.sortMode = 'manual';
      applyListOrder(filteredEntries().map(x => x.id));
      persistUi();
    }
  });
  content.addEventListener('dragover', e => {
    if (!dragRowId) return;
    const tr = e.target.closest && e.target.closest('tbody tr[data-id]');
    if (!tr || tr.dataset.id === dragRowId) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    const rect = tr.getBoundingClientRect();
    const before = e.clientY < rect.top + rect.height / 2;
    $$('#listTableWrap tbody tr').forEach(r => r.classList.remove('drop-before', 'drop-after'));
    tr.classList.add(before ? 'drop-before' : 'drop-after');
  });
  content.addEventListener('drop', e => {
    if (!dragRowId) return;
    const tr = e.target.closest && e.target.closest('tbody tr[data-id]');
    if (!tr || tr.dataset.id === dragRowId) return;
    e.preventDefault();
    const rect = tr.getBoundingClientRect();
    const before = e.clientY < rect.top + rect.height / 2;
    const dragging = $(`#listTableWrap tbody tr[data-id="${CSS.escape(dragRowId)}"]`);
    if (dragging) tr.parentNode.insertBefore(dragging, before ? tr : tr.nextSibling);
    const ids = [...$$('#listTableWrap tbody tr[data-id]')].map(r => r.dataset.id);
    applyListOrder(ids);
    persistUi(); saveAll(); render();
  });
  content.addEventListener('dragend', () => {
    $$('#listTableWrap tbody tr').forEach(r => { r.classList.remove('dragging', 'drop-before', 'drop-after'); r.draggable = false; });
    dragRowId = '';
  });
  /* 模态框 */
  $('#entryForm').addEventListener('submit', submitEntry);
  $('#modalClose').innerHTML = I.x;
  $('#modalClose').addEventListener('click', closeModal);
  $('#entryForm [data-close]').addEventListener('click', closeModal);
  $('#modalBackdrop').addEventListener('click', e => { if (e.target === e.currentTarget) closeModal(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
  /* 所属行业 / 当前状态：支持自定义新增与删除，变更后加入/移出当前下拉列表（并同步到列表、筛选、看板、统计） */
  let industryPrev = '';
  $('#industrySelect').addEventListener('focus', () => { industryPrev = $('#industrySelect').value; });
  $('#industrySelect').addEventListener('change', e => {
    const sel = e.target;
    if (sel.value === '__custom__') {
      const name = window.prompt('输入新的行业名称（保存后加入下拉列表）');
      if (!name || !name.trim()) { sel.value = industryPrev || '互联网'; return; }
      buildIndustryOptions(addCustomOption(customIndustries, LS_INDUSTRIES_KEY, name));
    } else if (sel.value === '__del__') {
      const name = promptPickCustom('删除自定义行业', customIndustries);
      if (name && deleteCustomOption('industry', customIndustries, LS_INDUSTRIES_KEY, name)) buildIndustryOptions(industryPrev);
      else sel.value = industryPrev || '互联网';
    }
  });
  let statusPrev = '';
  $('#statusSelect').addEventListener('focus', () => { statusPrev = $('#statusSelect').value; });
  $('#statusSelect').addEventListener('change', e => {
    const sel = e.target;
    if (sel.value === '__custom__') {
      const name = window.prompt('输入新的状态名称（保存后加入下拉列表与看板列）');
      if (!name || !name.trim()) { sel.value = statusPrev || '待投递'; return; }
      buildStatusOptions(addCustomOption(customStatuses, LS_STATUSES_KEY, name));
    } else if (sel.value === '__del__') {
      const name = promptPickCustom('删除自定义状态', customStatuses);
      if (name && deleteCustomOption('status', customStatuses, LS_STATUSES_KEY, name)) buildStatusOptions(statusPrev);
      else sel.value = statusPrev || '待投递';
    }
  });
  /* 工作地点多选面板：点击外部收起 */
  document.addEventListener('click', e => {
    if (!e.target.closest('.ms-wrap')) $$('.ms-wrap.open').forEach(w => w.classList.remove('open'));
  });
}
function applySidebar() {
  const sb = $('#sidebar');
  sb.classList.toggle('collapsed', !!ui.collapsed);
  sb.style.width = ui.collapsed ? '60px' : (ui.width || 228) + 'px';
}

/* ==================== 启动 ==================== */
async function init() {
  loadCustomLists();
  loadLocal();
  loadUi();
  applyStoredOrder(); // ui 加载后恢复手动顺序（loadLocal 时 ui 尚未就绪）
  buildNav();
  buildStatusOptions();
  $('#logoBox').innerHTML = I.logoMark;
  applySidebar();
  bindEvents();
  render();
  await initSync();
}
document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
